# Alembic configuration for GenXChains.
#
# The database URL is NOT set here — env.py reads it from app.config.settings
# so that alembic, the API and the test suite can never disagree about which
# database they are pointing at. Override with DATABASE_URL in the environment
# or .env, or per-invocation with `alembic -x db_url=...`.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Filenames are prefixed with the date so `ls` shows the chain in order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
